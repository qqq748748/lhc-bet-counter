<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六合彩投注统计 · 手机版</title>
<style>
  :root { color-scheme: dark; --bg:#101317; --card:#191e25; --line:#2b3440; --text:#f2f5f8; --muted:#9ba8b7; --accent:#5ad4a7; --danger:#ff8686; }
  * { box-sizing:border-box; } body { margin:0; background:linear-gradient(135deg,#101317,#17222b); color:var(--text); font:16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:1060px; margin:auto; padding:38px 22px 56px; } h1 { margin:0 0 6px; font-size:30px; } .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:rgba(25,30,37,.94); border:1px solid var(--line); border-radius:16px; padding:20px; margin:16px 0; box-shadow:0 12px 35px #0002; }
  textarea { width:100%; min-height:230px; resize:vertical; border:1px solid var(--line); border-radius:11px; background:#10151b; color:var(--text); padding:14px; font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; } button { border:0; border-radius:9px; padding:10px 16px; cursor:pointer; background:#2a3540; color:var(--text); font-weight:650; } button.primary { background:var(--accent); color:#062a20; } button:hover { filter:brightness(1.12); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; } .stat { border:1px solid var(--line); border-radius:12px; padding:15px; } .stat span { display:block; color:var(--muted); font-size:13px; } .stat strong { display:block; margin-top:5px; font-size:26px; color:var(--accent); }
  h2 { margin:22px 0 10px; font-size:18px; } pre { margin:0; white-space:pre-wrap; font:17px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; } .warning { color:#ffca83; margin-top:14px; } .detail { display:grid; grid-template-columns:repeat(auto-fit,minmax(72px,1fr)); gap:7px; } .chip { background:#10151b; border:1px solid var(--line); border-radius:7px; padding:7px 8px; text-align:center; font:14px ui-monospace,monospace; } .chip.zero { color:#6f7c89; }
  .help { color:var(--muted); font-size:14px; line-height:1.65; } .hidden { display:none; } @media(max-width:560px){ main{padding:24px 14px 42px}.stats{grid-template-columns:1fr}.card{padding:15px} }
</style>
</head>
<body><main>
  <h1>六合彩投注统计</h1>
  <p class="sub">2026 马年生肖号码表 · 纯本地计算，不上传内容</p>
  <section class="card">
    <textarea id="input" placeholder="粘贴投注内容，例如：&#10;01,06,07各15，鼠牛各10，28/150&#10;狗，龙，牛，猪，马，兔/5"></textarea>
    <div class="actions"><button class="primary" id="calculate">统计</button><button id="copy">复制结果</button><button id="clear">清空</button></div>
    <p class="help">支持：号码列表“各15”、生肖列表“各10”、单号“28/150”、生肖列表“狗，龙，牛/5”。逗号、句号、顿号、空格和换行均可分隔。</p>
  </section>
  <section id="result" class="card hidden">
    <div class="stats"><div class="stat"><span>总金额</span><strong id="total">0</strong></div><div class="stat"><span>已买号码</span><strong id="count">0</strong></div><div class="stat"><span>未买号码</span><strong id="missing">—</strong></div></div>
    <h2>按金额汇总</h2><pre id="groups"></pre>
    <h2>逐号明细</h2><div id="details" class="detail"></div>
    <p id="warnings" class="warning hidden"></p>
  </section>
</main>
<script>
const zodiac={鼠:[7,19,31,43],牛:[6,18,30,42],虎:[5,17,29,41],兔:[4,16,28,40],龙:[3,15,27,39],蛇:[2,14,26,38],马:[1,13,25,37,49],羊:[12,24,36,48],猴:[11,23,35,47],鸡:[10,22,34,46],狗:[9,21,33,45],猪:[8,20,32,44]};
const input=document.querySelector('#input'), saved=localStorage.getItem('lhc-bets-2026'); if(saved) input.value=saved;
const pad=n=>String(n).padStart(2,'0');
function tokens(s){ return s.match(/(?:[鼠牛虎兔龙蛇马羊猴鸡狗猪]|(?:0?[1-9]|[1-4][0-9]))/g)||[]; }
function parse(text){
 const amounts=Array(50).fill(0), warnings=[], used=[];
 const chunks=text.replace(/[，、。\.；;\n\s]+/g,',').split(',').map(x=>x.trim()).filter(Boolean);
 function add(list,amount){ list.forEach(v=>{ if(zodiac[v]) zodiac[v].forEach(n=>amounts[n]+=amount); else { const n=Number(v); if(n>=1&&n<=49) amounts[n]+=amount; else warnings.push('无效号码：'+v); } }); }
 for(let i=0;i<chunks.length;){
   let group=[], j=i;
   while(j<chunks.length && /^([鼠牛虎兔龙蛇马羊猴鸡狗猪]|0?[1-9]|[1-4][0-9])$/.test(chunks[j])) { group.push(chunks[j]); j++; }
   const endingEach=j<chunks.length && chunks[j].match(/^([鼠牛虎兔龙蛇马羊猴鸡狗猪]|0?[1-9]|[1-4][0-9])各\s*(\d+)$/);
   if(group.length && endingEach) { group.push(endingEach[1]); add(group,Number(endingEach[2])); i=j+1; continue; }
   const endingSlash=j<chunks.length && chunks[j].match(/^([鼠牛虎兔龙蛇马羊猴鸡狗猪]|0?[1-9]|[1-4][0-9])\s*\/\s*(\d+)$/);
   if(group.length && endingSlash) { group.push(endingSlash[1]); add(group,Number(endingSlash[2])); i=j+1; continue; }
   if(j<chunks.length && /^(各\s*)?\d+$/.test(chunks[j])) { const amount=Number(chunks[j].replace('各','').trim()); add(group,amount); i=j+1; continue; }
   if(group.length && j===i+1) { warnings.push('未找到金额：'+chunks[i]); i++; continue; }
   // combine patterns such as 28/150 that remain a single chunk
   const slash=chunks[i].match(/^([鼠牛虎兔龙蛇马羊猴鸡狗猪]|0?[1-9]|[1-4][0-9])\s*(?:号\s*)?(?:\/\s*)?(\d+)$/);
   if(slash){ add([slash[1]],Number(slash[2])); i++; continue; }
   // Supports adjacent input without commas: 01 06 07各15 or 鼠牛各10
   const each=chunks[i].match(/^(.*?)各\s*(\d+)$/);
   if(each){ const list=tokens(each[1]); if(list.length) add(list,Number(each[2])); else warnings.push('无法识别：'+chunks[i]); i++; continue; }
   const multiSlash=chunks[i].match(/^(.*?)\s*\/\s*(\d+)$/);
   if(multiSlash){ const list=tokens(multiSlash[1]); if(list.length) add(list,Number(multiSlash[2])); else warnings.push('无法识别：'+chunks[i]); i++; continue; }
   warnings.push('无法识别：'+chunks[i]); i++;
 }
 return {amounts,warnings};
}
function render(){
 const {amounts,warnings}=parse(input.value); localStorage.setItem('lhc-bets-2026',input.value);
 const total=amounts.reduce((a,b)=>a+b,0), bought=[]; for(let n=1;n<=49;n++)if(amounts[n])bought.push(n);
 const map=new Map; bought.forEach(n=>{const a=amounts[n];map.set(a,[...(map.get(a)||[]),n]);});
 document.querySelector('#total').textContent=total; document.querySelector('#count').textContent=bought.length;
 const absent=[];for(let n=1;n<=49;n++)if(!amounts[n])absent.push(pad(n)); document.querySelector('#missing').textContent=absent.length?absent.join('、'):'无';
 document.querySelector('#groups').textContent=[...map.entries()].sort((a,b)=>b[0]-a[0]).map(([a,ns])=>String(a).padStart(3,' ')+'：'+ns.map(pad).join('、')).join('\n') || '尚未识别到投注。';
 document.querySelector('#details').innerHTML=Array.from({length:49},(_,i)=>{const n=i+1,a=amounts[n];return `<div class="chip ${a?'':'zero'}">${pad(n)}：${a||'—'}</div>`}).join('');
 const w=document.querySelector('#warnings'); w.textContent=warnings.length?'未计入：'+warnings.join('；'):''; w.classList.toggle('hidden',!warnings.length); document.querySelector('#result').classList.remove('hidden');
}
document.querySelector('#calculate').onclick=render; document.querySelector('#clear').onclick=()=>{input.value='';localStorage.removeItem('lhc-bets-2026');document.querySelector('#result').classList.add('hidden');input.focus();};
document.querySelector('#copy').onclick=async()=>{render();const text=`总金额：${document.querySelector('#total').textContent}\n已买号码：${document.querySelector('#count').textContent}\n未买号码：${document.querySelector('#missing').textContent}\n\n${document.querySelector('#groups').textContent}`;try{await navigator.clipboard.writeText(text);document.querySelector('#copy').textContent='已复制';setTimeout(()=>document.querySelector('#copy').textContent='复制结果',1300)}catch{prompt('请复制：',text)}};
if(input.value) render();
</script></body></html>
